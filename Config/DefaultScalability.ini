; Тени Парижа — уровни качества (0 Низкие, 1 Средние, 2 Высокие, 3 Эпические).
; Средние — цель для GeForce GTX 760/960 и Radeon R9 270 в 1080p/60; Эпические — для современных карт.
; Здесь только отличия от BaseScalability.ini движка. Запреты проекта: не больше 3 каскадов, без объёмного тумана, SSR не выше 2.

[ViewDistanceQuality@0]
r.SkeletalMeshLODBias=1
r.ViewDistanceScale=0.5
[ViewDistanceQuality@1]
