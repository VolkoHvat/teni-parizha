; Тени Парижа — настройки движка под UE 4.27 и ПК 2014 года (DX11, динамический свет, без дорогих технологий).
[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Maps/Paris.Paris
EditorStartupMap=/Game/Maps/Paris.Paris
GlobalDefaultGameMode=/Script/TeniParizha.TPGameMode

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX11
+TargetedRHIs=PCD3D_SM5

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Scalable
AppliedDefaultGraphicsPerformance=Scalable

[/Script/Engine.RendererSettings]
; только динамическое освещение: без запекания и лишних вариантов шейдеров
r.AllowStaticLighting=False
r.GenerateMeshDistanceFields=False
r.RayTracing=False
r.SupportSkyAtmosphere=True
r.SupportSkyAtmosphereAffectsHeightFog=True
r.SkinCache.CompileShaders=False
r.DefaultFeature.AutoExposure=True
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.LensFlare=False
r.DefaultFeature.Bloom=True
r.DefaultFeature.AmbientOcclusion=True
r.DefaultFeature.AmbientOcclusionStaticFraction=False
r.AntiAliasingMethod=2
r.ReflectionCaptureResolution=128
r.ForwardShading=False
r.CustomDepth=1

[/Script/Engine.Engine]
bSmoothFrameRate=False
bUseFixedFrameRate=False

[/Script/Engine.CollisionProfile]
+Profiles=(Name="TPClimbable",CollisionEnabled=QueryAndPhysics,ObjectTypeName="WorldStatic",CustomResponses=,HelpMessage="Стены, по которым можно лазать")

[/Script/NavigationSystem.RecastNavMesh]
RuntimeGeneration=Dynamic
